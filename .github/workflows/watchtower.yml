name: Watchtower report
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Only run specs under this path (e.g. tests/checkout)"
        required: false
        default: ""
      grep:
        description: "Only run tests whose title matches this pattern"
        required: false
        default: ""
jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run tests
        env:
          PATROL_PATH: ${{ inputs.path }}
          PATROL_GREP: ${{ inputs.grep }}
          # Write the JSON reporter straight to a file — NOT via stdout redirect.
          # A repo's global-setup/test console output pollutes stdout, corrupting
          # a "> report.json" capture into invalid JSON the ingest rejects (#166).
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
        run: npx playwright test $PATROL_PATH ${PATROL_GREP:+--grep "$PATROL_GREP"} --reporter=json || true
      - name: Report to Watchtower
        if: always()
        run: |
          test -s report.json || { echo "::error::empty report"; exit 1; }
          # Retry the upload: a single 429/blip from the dashboard host must not
          # lose a finished report (#133).
          status=$(curl --silent --show-error --output response.txt --write-out "%{http_code}" \
            --retry 15 --retry-all-errors --retry-delay 25 \
            -X POST "${{ secrets.WATCHTOWER_INGEST_URL }}" \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_INGEST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "X-Watchtower-Repo: ${{ github.repository }}" \
            -H "X-Watchtower-Branch: ${{ github.ref_name }}" \
            -H "X-Watchtower-Commit: ${{ github.sha }}" \
            -H "X-Watchtower-Suite: ${{ inputs.path }}" \
            --data @report.json) || true
          case "$status" in
            2??) echo "Report ingested (HTTP $status)" ;;
            *)
              echo "::error::report upload failed after retries (HTTP ${status:-none})"
              [ -s response.txt ] && { echo "Response body:"; cat response.txt; }
              exit 1
              ;;
          esac
      # The report survives even when every retry loses (edge throttling,
      # #133): recover it from the run's artifacts and ingest by hand.
      - name: Keep report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-report
          path: report.json
          retention-days: 7
          if-no-files-found: ignore
